<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Kuan-Ming Chen 陳冠銘</title>
<meta name="description" content="Kuan-Ming Chen (陳冠銘) is an associate professor of economics at National Taiwan University studying labor, family, and health economics — how families are formed and how they support one another.">
<meta property="og:title" content="Kuan-Ming Chen 陳冠銘">
<meta property="og:description" content="Associate Professor of Economics, National Taiwan University. Labor, family, and health economics.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Space+Mono:wght@400;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --px:52px; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#F3F1EC; }
  body{ font-family:'Source Serif 4',serif; -webkit-font-smoothing:antialiased; }
  a{ text-decoration:none; color:inherit; }
  img{ max-width:100%; }
  [data-inst],[data-stagecol],[data-mapfilter],[data-chip],[data-student-card],[data-feat-dot],[data-feat-prev],[data-feat-next],[data-lang]{ cursor:pointer; }
  [data-stagecol]:hover [style*="border-radius:50%"]{ filter:brightness(1.04); }
  @keyframes kmcspin{ to{ transform:rotate(360deg); } }

  /* ---------- Tablet / phone ---------- */
  @media (max-width: 880px){
    :root{ --px:22px; }
    .kmc-nav{ flex-wrap:wrap !important; gap:10px !important; padding-top:13px !important; padding-bottom:13px !important; }
    .kmc-navlinks{ width:100%; gap:15px !important; flex-wrap:wrap !important; row-gap:9px !important; justify-content:flex-start !important; }
    .kmc-hero-photo{ min-height:300px !important; border-left:none !important; border-top:1px solid rgba(30,31,26,.12) !important; }
    .kmc-timeline{ overflow-x:auto !important; padding-bottom:8px !important; -webkit-overflow-scrolling:touch; }
    .kmc-timeline-inner{ min-width:540px; }
    [style*="grid-template-columns:1fr 300px"]{ grid-template-columns:1fr !important; }
    [style*="grid-template-columns:420px 1fr"]{ grid-template-columns:1fr !important; }
    [style*="grid-template-columns:1fr 1.3fr"]{ grid-template-columns:1fr !important; }
    [style*="grid-template-columns:1fr 360px"]{ grid-template-columns:1fr !important; }
    [style*="grid-template-columns:1fr 1fr 1fr"]{ grid-template-columns:1fr 1fr !important; }
    [style*="grid-template-columns:repeat(4,1fr)"]{ grid-template-columns:1fr 1fr !important; }
    [style*="grid-template-columns:1fr 1fr;"]{ grid-template-columns:1fr !important; }
    [style*="grid-template-columns:2fr 1fr 1fr"]{ grid-template-columns:1fr 1fr !important; }
    [style*="grid-template-columns:120px 1fr 150px"]{ grid-template-columns:auto 1fr !important; gap:6px 16px !important; }
    [style*="font-size:56px"]{ font-size:38px !important; }
    [style*="font-size:46px"]{ font-size:30px !important; }
    [style*="font-size:44px"]{ font-size:30px !important; }
    [style*="font-size:62px"]{ font-size:44px !important; }
  }
  /* ---------- Small phone ---------- */
  @media (max-width: 560px){
    .kmc-navlinks{ gap:13px !important; }
    [style*="grid-template-columns:1fr 1fr 1fr"]{ grid-template-columns:1fr !important; }
    [style*="grid-template-columns:repeat(4,1fr)"]{ grid-template-columns:1fr 1fr !important; }
    [style*="grid-template-columns:2fr 1fr 1fr"]{ grid-template-columns:1fr !important; }
    [style*="font-size:56px"]{ font-size:32px !important; }
  }
</style>
<script src="./kmc-site.js"></script>
</helmet>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#1E1F1A"/>
    <text x="50" y="50" font-family="'Space Grotesk',sans-serif" font-size="30" font-weight="700" fill="#F3F1EC" text-anchor="middle" dominant-baseline="central">KC</text>
    <circle cx="50" cy="74" r="4" fill="#1F6B4A"/>
  </svg>
</template>
<div style="min-height:100vh; background:#F3F1EC; color:#1E1F1A;">
  {{ appEl }}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready:false, lang:'en', route:'home', inst:'household', stage:'child', pid:null, filter:'all', sOpen:null, labels:{}, featIdx:0 };

  componentDidMount(){
    this._q = '';
    // restore language
    try { var lg = localStorage.getItem('kmc-lang'); if(lg==='en'||lg==='zh') this.state.lang = lg; } catch(e){}
    // initial route
    var h = this._parseHash();
    Object.assign(this.state, this._routeState(h));
    // load data (live sheet or baked)
    var go = () => window.KMC.load().then((data) => { window.KMC.setData(data); this.setState({ ready:true }); });
    if(window.KMC) go();
    else this._poll = setInterval(() => { if(window.KMC){ clearInterval(this._poll); go(); } }, 40);
    // hash routing
    this._onHash = () => {
      var st = this._routeState(this._parseHash());
      this.setState(st);
      try { window.scrollTo(0,0); } catch(e){}
    };
    window.addEventListener('hashchange', this._onHash);
    // featured auto-rotate
    this._featTimer = setInterval(() => {
      if(this.state.ready && !this._featPaused && this.state.route==='featured' && window.KMC){
        this.setState(s => ({ featIdx:(s.featIdx+1) % window.KMC.featuredCount() }));
      }
    }, 5000);
  }
  componentWillUnmount(){ if(this._poll) clearInterval(this._poll); if(this._featTimer) clearInterval(this._featTimer); window.removeEventListener('hashchange', this._onHash); }

  _parseHash(){
    var raw = (location.hash || '').replace(/^#\/?/, '');
    var qi = raw.indexOf('?');
    var path = qi>=0 ? raw.slice(0,qi) : raw;
    var qs = qi>=0 ? raw.slice(qi+1) : '';
    var params = {};
    qs.split('&').forEach(p => { if(!p) return; var kv = p.split('='); params[kv[0]] = decodeURIComponent(kv[1]||''); });
    return { route: path || 'home', params: params };
  }
  _routeState(h){
    var st = { route:h.route, pid:null };
    if(h.route==='research' && h.params.inst && window.KMC){
      st.inst = h.params.inst; st.stage = window.KMC.firstStage(h.params.inst);
    }
    return st;
  }
  buildState(){
    var s = this.state;
    return { lang:s.lang, route:s.route, inst:s.inst, stage:s.stage, pid:s.pid, filter:s.filter, sOpen:s.sOpen, q:this._q||'', labels:s.labels, featIdx:s.featIdx };
  }

  onClick = (e) => {
    var t;
    if((t = e.target.closest('[data-lang]'))){ var lg = t.getAttribute('data-lang'); try{ localStorage.setItem('kmc-lang', lg); }catch(err){} this.setState({ lang:lg }); return; }
    if(e.target.closest('[data-nav]')) return; // let the anchor change the hash
    if((t = e.target.closest('[data-inst]'))){ var inst = t.getAttribute('data-inst'); this.setState({ inst:inst, stage:window.KMC.firstStage(inst), pid:null }); return; }
    if((t = e.target.closest('[data-open-pid]'))){ this.setState({ pid:t.getAttribute('data-open-pid') }); return; }
    if(e.target.closest('[data-back]')){ this.setState({ pid:null }); return; }
    if((t = e.target.closest('[data-stagecol]'))){ this.setState({ stage:t.getAttribute('data-stagecol'), pid:null }); return; }
    if((t = e.target.closest('[data-mapfilter]'))){ this.setState({ filter:t.getAttribute('data-mapfilter') }); return; }
    if((t = e.target.closest('[data-student-card]'))){ var id = t.getAttribute('data-student-card'); this.setState({ sOpen: this.state.sOpen===id ? null : id }); return; }
    if((t = e.target.closest('[data-chip]'))){ var k = t.getAttribute('data-chip'); var labels = Object.assign({}, this.state.labels); labels[k] = !labels[k]; this.setState({ labels:labels }); return; }
    if((t = e.target.closest('[data-feat-dot]'))){ this._featPaused = true; this.setState({ featIdx: parseInt(t.getAttribute('data-feat-dot'),10) }); return; }
    if(e.target.closest('[data-feat-next]')){ this._featPaused = true; this.setState(s => ({ featIdx:(s.featIdx+1)%window.KMC.featuredCount() })); return; }
    if(e.target.closest('[data-feat-prev]')){ this._featPaused = true; this.setState(s => ({ featIdx:(s.featIdx-1+window.KMC.featuredCount())%window.KMC.featuredCount() })); return; }
  };
  onOver = (e) => {
    if(this.state.pid || this.state.route!=='research') return;
    var sc = e.target.closest('[data-stagecol]');
    if(sc){ var k = sc.getAttribute('data-stagecol'); if(this.state.stage!==k) this.setState({ stage:k }); }
  };
  onInput = (e) => {
    var inp = e.target.closest('[data-browse-search]');
    if(!inp) return;
    this._q = inp.value;
    var root = e.currentTarget;
    var list = root.querySelector('[data-browse-list]');
    if(list) list.innerHTML = window.KMC.browseListHTML(this.buildState());
    var cnt = root.querySelector('[data-browse-count]');
    if(cnt) cnt.textContent = window.KMC.browseCount(this.buildState());
  };

  renderVals(){
    var mk = (html, extra) => React.createElement('div', Object.assign({ dangerouslySetInnerHTML:{ __html:html } }, extra||{}));
    if(!this.state.ready || !window.KMC){
      var splash = '<div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:#F3F1EC;">'
        + '<div style="width:34px; height:34px; border-radius:50%; border:3px solid rgba(31,107,74,.18); border-top-color:#1F6B4A; animation:kmcspin .8s linear infinite;"></div>'
        + '<div style="font-family:\'Space Mono\',monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#9a978c;">Kuan-Ming Chen</div></div>';
      return { appEl: mk(splash) };
    }
    var s = this.buildState();
    var html = window.KMC.navHTML(s.route, s.lang)
      + '<main data-page="' + s.route + '" style="max-width:1160px; margin:0 auto; background:#F3F1EC;">' + window.KMC.pageHTML(s) + '</main>'
      + window.KMC.footerHTML(s.lang);
    return { appEl: mk(html, { key: s.route + ':' + s.lang, onClick: this.onClick, onMouseOver: this.onOver, onInput: this.onInput }) };
  }
}
</script>
</body>
</html>
